     Acepta coma o punto, un solo separador, dígitos y un signo menos al inicio.
     Devuelve siempre string. Los consumidores hacen Number(value) al guardar. */
  const parseNum = (v) => {
    if (v === '' || v == null) return '';
    let s = String(v).replace(',', '.');
    s = s.replace(/[^0-9.\-]/g, '');
    const firstDot = s.indexOf('.');
    if (firstDot !== -1) s = s.slice(0, firstDot + 1) + s.slice(firstDot + 1).replace(/\./g, '');

    return s;
  };

      const t0 = audioCtx.currentTime;
      [880, 660, 880].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, t0 + i * 0.18);
        gain.gain.exponentialRampToValueAtTime(0.4, t0 + i * 0.18 + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + i * 0.18 + 0.15);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(t0 + i * 0.18);
        osc.stop(t0 + i * 0.18 + 0.16);
      });
    } catch (e) {}
  };

  const KPIBar = ({ label, current, target }) => {

  const Confirm = ({ open, title, message, confirmLabel = 'Borrar', confirmColor = 'red', onConfirm, onCancel }) => {

  /* Input numérico que acepta coma o punto. */
  const NumberInput = ({ value, onChange, suffix, large = false, disabled = false, placeholder = '', integer = false }) => (
    <div className="flex-1 relative min-w-0">
      <input
        type="text"

        className={`w-full bg-zinc-950 border border-zinc-800 rounded-2xl ${large ? 'p-5 text-2xl' : 'p-4 text-xl'} text-center font-black outline-none focus:border-emerald-500 transition-colors`} />

  /* ============================================================
     GRÁFICAS (Chart.js wrapped)
     ============================================================ */
  const PhysicalChart = ({ entries }) => {
    const ref = useRef(null);
    useEffect(() => {
      if (!ref.current || typeof Chart === 'undefined' || entries.length === 0) return;
      const labels  = entries.map(h => h.date);
      const peso    = entries.map(h => h.weight);
      const cintura = entries.map(h => h.waist);
      const minP = Math.min(...peso),    maxP = Math.max(...peso);
      const minC = Math.min(...cintura), maxC = Math.max(...cintura);
      const lastIdx = peso.length - 1;
      const radius     = peso.map((_, i) => i === lastIdx ? 7 : 4);
      const hoverRad   = peso.map((_, i) => i === lastIdx ? 9 : 6);
      const ptColorP   = peso.map((_, i) => i === lastIdx ? '#fbbf24' : '#3b82f6');
      const ptColorC   = peso.map((_, i) => i === lastIdx ? '#fbbf24' : '#10b981');
      const ptBorderW  = peso.map((_, i) => i === lastIdx ? 3 : 1);

      const inst = new Chart(ref.current, {
        type: 'line',
        data: {
          labels,
          datasets: [
            { label: 'Peso',    data: peso,    yAxisID: 'y',
              borderColor: '#3b82f6', backgroundColor: 'rgba(59,130,246,0.12)',
              pointBackgroundColor: ptColorP, pointBorderColor: ptColorP, pointBorderWidth: ptBorderW,
              pointRadius: radius, pointHoverRadius: hoverRad,
              tension: 0.3, borderWidth: 3, fill: true },
            { label: 'Cintura', data: cintura, yAxisID: 'y1',
              borderColor: '#10b981', backgroundColor: 'rgba(16,185,129,0.10)',
              pointBackgroundColor: ptColorC, pointBorderColor: ptColorC, pointBorderWidth: ptBorderW,
              pointRadius: radius, pointHoverRadius: hoverRad,
              tension: 0.3, borderWidth: 3, fill: false }
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { position: 'top',
              labels: { usePointStyle: true, boxWidth: 10, padding: 12,
                font: { size: 12, weight: '600' }, color: '#e4e4e7' } },
            tooltip: {
              backgroundColor: '#18181b', borderColor: '#27272a', borderWidth: 1,
              titleColor: '#fbbf24', titleFont: { size: 12, weight: 'bold' },
              bodyColor: '#e4e4e7', bodyFont: { size: 12, weight: '600' },
              padding: 10,
              callbacks: {
                label: (ctx) => `${ctx.dataset.label}: ${ctx.parsed.y} ${ctx.datasetIndex === 0 ? 'kg' : 'cm'}`
              }
            }
          },
          scales: {
            x:  { grid: { color: 'rgba(39,39,42,0.5)' },
                  ticks: { font: { size: 11, weight: 'bold' }, color: '#a1a1aa',
                           maxRotation: 0, autoSkip: true, maxTicksLimit: 6 } },
            y:  { type: 'linear', position: 'left',
                  grid: { color: 'rgba(39,39,42,0.5)' },
                  ticks: { font: { size: 11, weight: 'bold' }, color: '#60a5fa',
                           callback: v => v + 'kg' },
                  suggestedMin: Math.floor(minP - 1), suggestedMax: Math.ceil(maxP + 1) },
            y1: { type: 'linear', position: 'right',
                  grid: { drawOnChartArea: false },
                  ticks: { font: { size: 11, weight: 'bold' }, color: '#34d399',
                           callback: v => v + 'cm' },
                  suggestedMin: Math.floor(minC - 1), suggestedMax: Math.ceil(maxC + 1) }
          }
        }
      });
      return () => inst.destroy();
    }, [entries]);

    if (entries.length === 0) {
      return <p className="text-zinc-700 text-center py-12 text-[10px] uppercase font-black tracking-widest italic">Sin pesajes registrados</p>;
    }
    return <div className="relative h-72 w-full"><canvas ref={ref} /></div>;
  };

  const StrengthChart = ({ lifts, targets }) => {
    const ref = useRef(null);
    useEffect(() => {
      if (!ref.current || typeof Chart === 'undefined') return;
      const labels = ['Banca', 'RDL', 'Frontal', 'Militar'];
      const ids = ['bench', 'rdl', 'sq', 'mil'];
      const current   = ids.map(i => lifts[i] || 0);
      const remaining = ids.map(i => Math.max(0, (targets[i] || 0) - (lifts[i] || 0)));
      const reachedColors = ids.map(i => (lifts[i] || 0) >= (targets[i] || 0) ? '#fbbf24' : '#10b981');

      const inst = new Chart(ref.current, {
        type: 'bar',
        data: {
          labels,
          datasets: [
            { label: 'Actual', data: current,
              backgroundColor: reachedColors,
              borderRadius: 8, borderSkipped: false, barPercentage: 0.75 },
            { label: 'Falta',  data: remaining,
              backgroundColor: '#3f3f46',
              borderRadius: 8, borderSkipped: false, barPercentage: 0.75 }
          ]
        },
        options: {
          indexAxis: 'y',
          responsive: true, maintainAspectRatio: false,
          plugins: {
            legend: { position: 'top',
              labels: { usePointStyle: true, boxWidth: 10, padding: 12,
                font: { size: 12, weight: '600' }, color: '#e4e4e7' } },
            tooltip: {
              backgroundColor: '#18181b', borderColor: '#27272a', borderWidth: 1,
              titleColor: '#10b981', titleFont: { size: 12, weight: 'bold' },
              bodyColor: '#e4e4e7', bodyFont: { size: 12, weight: '600' },
              padding: 10,
              callbacks: {
                label: (ctx) => `${ctx.dataset.label}: ${ctx.parsed.x} kg`,
                footer: (items) => {
                  if (!items[0]) return '';
                  const id = ids[items[0].dataIndex];
                  const cur = lifts[id] || 0; const tgt = targets[id] || 0;
                  const pct = tgt > 0 ? Math.round((cur / tgt) * 100) : 0;
                  return `Meta: ${tgt} kg · ${pct}%`;
                }
              }
            }
          },
          scales: {
            x: { stacked: true, beginAtZero: true,
                 grid: { color: 'rgba(39,39,42,0.5)' },
                 ticks: { font: { size: 11, weight: 'bold' }, color: '#a1a1aa',
                          callback: v => v + 'kg' } },
            y: { stacked: true,
                 grid: { display: false },
                 ticks: { font: { size: 13, weight: 'bold' }, color: '#e4e4e7' } }
          }
        }
      });
      return () => inst.destroy();
    }, [lifts, targets]);
    return <div className="relative h-64 w-full"><canvas ref={ref} /></div>;
  };

  /* ============================================================
     APP
     ============================================================ */
  const App = () => {
    const [tab, setTab] = useState('dashboard');
    const [flow, setFlow] = useState('idle');

    const [workouts, setWorkouts] = useState([]);
    const [walks, setWalks] = useState([]);
    const [health, setHealth] = useState([]);

    const [activeRoutine, setActiveRoutine] = useState(null);
    const [exerciseIndex, setExerciseIndex] = useState(0);
    const [currentSets, setCurrentSets] = useState([]);
    const [sessionLog, setSessionLog] = useState([]);
    const [sessionStartedAt, setSessionStartedAt] = useState(0);
    const [isSaving, setIsSaving] = useState(false);

    const [showWalkModal, setShowWalkModal] = useState(false);
    const [showHelpModal, setShowHelpModal] = useState(false);
    const [walkInput, setWalkInput] = useState('');
    const [healthInput, setHealthInput] = useState({ weight: '', waist: '', note: '' });
    const [confirm, setConfirm] = useState(null);
    const [resumePrompt, setResumePrompt] = useState(null);
    const [expandedWorkouts, setExpandedWorkouts] = useState(() => new Set());
    const [editingWorkout, setEditingWorkout] = useState(null);

    const [endsAt, setEndsAt] = useState(0);
    const [timer, setTimer] = useState(0);
    const [timerActive, setTimerActive] = useState(false);
    const [kbTime, setKbTime] = useState('');
    const [kbRounds, setKbRounds] = useState('');

    const [calMonth, setCalMonth] = useState(() => {
      const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1);
    });
    const [calSelectedDay, setCalSelectedDay] = useState(null);

    const wakeLockRef = useRef(null);
    const sessionLoadedRef = useRef(false);

    /* --- Carga inicial + detección de sesión activa --- */
    useEffect(() => {
      const lw = storage.load(KEYS.WORKOUTS, null);
      const lk = storage.load(KEYS.WALKS, null);
      const lh = storage.load(KEYS.HEALTH, null);
      const sv = storage.load(SEED_VERSION_KEY, 0);

      let w = (lw && lw.length > 0) ? lw.slice() : SEED_WORKOUTS.slice();
      let h = (lh && lh.length > 0) ? lh.slice() : SEED_HEALTH.slice();
      const k = lk || [];

      // Retrofit de id en entrenos antiguos sin id
      let migratedW = false;
      w = w.map(wk => {
        if (!wk.id) { migratedW = true; return { ...wk, id: uid() }; }
        return wk;
      });
      // Retrofit de timestamp en pesajes antiguos sin timestamp
      let migratedH = false;
      h = h.map(he => {
        if (!he.timestamp) { migratedH = true; return { ...he, timestamp: dateStrToTs(he.date) || Date.now() }; }
        return he;
      });

      if (!lw || lw.length === 0 || migratedW) storage.save(KEYS.WORKOUTS, w);
      if (!lh || lh.length === 0 || migratedH) storage.save(KEYS.HEALTH, h);
      if (!lk) storage.save(KEYS.WALKS, k);

      // Inyección incremental de seed (solo entradas que faltan, una vez por bump de SEED_VERSION).
      if (sv < SEED_VERSION) {
        let injectedW = false;
        const wIds = new Set(w.map(x => x.id));
        SEED_WORKOUTS.forEach(s => {
          if (!wIds.has(s.id)) { w.push(s); injectedW = true; }
        });
        if (injectedW) {
          w.sort((a, b) => a.timestamp - b.timestamp);
          storage.save(KEYS.WORKOUTS, w);
        }
        let injectedH = false;
        const hDates = new Set(h.map(x => x.date));
        SEED_HEALTH.forEach(s => {
          if (!hDates.has(s.date)) { h.push(s); injectedH = true; }
        });
        if (injectedH) {
          h.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
          storage.save(KEYS.HEALTH, h);
        }
        storage.save(SEED_VERSION_KEY, SEED_VERSION);
      }

      setWorkouts(w);
      setHealth(h);
      setWalks(k);

      // Detectar sesión sin acabar
      const session = storage.load(KEYS.SESSION, null);
      if (session && session.flow && session.flow !== 'idle' && session.flow !== 'finished') {
        setResumePrompt(session);
      }
      sessionLoadedRef.current = true;
    }, []);

    /* --- Service Worker --- */
    useEffect(() => {
      if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      }
    }, []);

    /* --- Auto-guardado de sesión activa --- */
    useEffect(() => {
      if (!sessionLoadedRef.current) return;
      const isActive = flow === 'prep' || flow === 'workout' || flow === 'summary';
      if (isActive && activeRoutine) {
        storage.save(KEYS.SESSION, {
          flow, activeRoutine, exerciseIndex, currentSets, sessionLog,
          sessionStartedAt, kbTime, kbRounds
        });
      } else {
        storage.remove(KEYS.SESSION);
      }
    }, [flow, activeRoutine, exerciseIndex, currentSets, sessionLog, kbTime, kbRounds]);

    /* --- Wake Lock (mantiene pantalla encendida durante el entreno) --- */
    useEffect(() => {
      const needLock = flow === 'prep' || flow === 'workout' || flow === 'summary' || timerActive;
      let cancelled = false;

      const acquire = async () => {
        if (!('wakeLock' in navigator)) return;
        try {
          const lock = await navigator.wakeLock.request('screen');
          if (cancelled) { lock.release().catch(() => {}); return; }
          wakeLockRef.current = lock;
          lock.addEventListener('release', () => { wakeLockRef.current = null; });
        } catch (e) {}
      };
      const release = () => {
        if (wakeLockRef.current) {
          wakeLockRef.current.release().catch(() => {});
          wakeLockRef.current = null;
        }
      };
      const onVisibility = () => {
        if (document.visibilityState === 'visible' && needLock && !wakeLockRef.current) acquire();
      };

      if (needLock) acquire(); else release();
      document.addEventListener('visibilitychange', onVisibility);
      return () => {
        cancelled = true;
        document.removeEventListener('visibilitychange', onVisibility);
        release();
      };
    }, [flow, timerActive]);

    /* --- Timer basado en timestamp (inmune a background) --- */
    useEffect(() => {
      if (!timerActive) return;
      const tick = () => {
        const remaining = Math.ceil((endsAt - Date.now()) / 1000);
        if (remaining <= 0) {
          setTimer(0);
          setTimerActive(false);
          beep();
          vibrate([220, 120, 220, 120, 220]);
        } else {
          setTimer(remaining);
        }
      };
      tick();
      const id = setInterval(tick, 250);
      return () => clearInterval(id);
    }, [timerActive, endsAt]);

    /* ========================================================
       HELPERS DE NEGOCIO
       ======================================================== */
    const persist = (key, value, setter) => { setter(value); storage.save(key, value); };

    /* Devuelve mapa { exerciseId → [{reps, weight}, ...] } de la última sesión
       cuya rutina coincide. */
    const getLastSessionValues = (routineName) => {
      for (let i = workouts.length - 1; i >= 0; i--) {
        if (workouts[i].routine === routineName) {
          const map = {};
          (workouts[i].log || []).forEach(e => { map[e.id] = e.sets || []; });
          return { map, when: workouts[i].timestamp };
        }
      }
      return null;
    };

    const handleAddMetric = () => {
      const w = Number(healthInput.weight);
      const c = Number(healthInput.waist);
      if (!w || !c || isNaN(w) || isNaN(c) || w <= 0 || c <= 0) return;
      const entry = {
        date: new Date().toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit' }),
        weight: w,
        waist: c,
        note: healthInput.note.trim() || '-',
        timestamp: Date.now()
      };
      persist(KEYS.HEALTH, [...health, entry], setHealth);
      setHealthInput({ weight: '', waist: '', note: '' });
      vibrate(20);
    };

    const askDeleteMetric = (idx) => setConfirm({
      title: 'Borrar registro',
      message: '¿Eliminar este pesaje del histórico?',
      onConfirm: () => {
        persist(KEYS.HEALTH, health.filter((_, i) => i !== idx), setHealth);
        setConfirm(null);
      }
    });

    const askDeleteWorkout = (idx) => {
      const target = workouts[idx];
      setConfirm({
        title: 'Borrar entrenamiento',
        message: '¿Eliminar esta sesión completa? No se puede deshacer.',
        onConfirm: () => {
          persist(KEYS.WORKOUTS, workouts.filter((_, i) => i !== idx), setWorkouts);
          setExpandedWorkouts(prev => {
            const n = new Set();
            prev.forEach(id => { if (id !== target.id) n.add(id); });
            return n;
          });
          setConfirm(null);
        }
      });
    };

    const askDeleteWalk = (idx) => setConfirm({
      title: 'Borrar caminata',
      message: '¿Eliminar este registro NEAT?',
      onConfirm: () => {
        persist(KEYS.WALKS, walks.filter((_, i) => i !== idx), setWalks);
        setConfirm(null);
      }
    });

    const toggleExpand = (id) => {
      setExpandedWorkouts(prev => {
        const n = new Set(prev);
        if (n.has(id)) n.delete(id); else n.add(id);
        return n;
      });
    };

    /* --- Edición de entrenamiento existente --- */
    const startEditWorkout = (idx) => {
      const w = workouts[idx];
      setEditingWorkout({
        idx,
        data: {
          ...w,
          log: (w.log || []).map(ex => ({
            ...ex,
            sets: (ex.sets || []).map(s => ({ reps: s.reps, weight: s.weight }))
          }))
        }
      });
    };
    const cancelEditWorkout = () => setEditingWorkout(null);
    const updateEditSet = (exIdx, setIdx, field, value) => {
      setEditingWorkout(prev => ({
        ...prev,
        data: { ...prev.data,
          log: prev.data.log.map((ex, i) => i === exIdx
            ? { ...ex, sets: ex.sets.map((s, j) => j === setIdx ? { ...s, [field]: value } : s) }
            : ex)
        }
      }));
    };
    const removeEditSet = (exIdx, setIdx) => {
      setEditingWorkout(prev => ({ ...prev, data: { ...prev.data,
        log: prev.data.log.map((ex, i) => i === exIdx ? { ...ex, sets: ex.sets.filter((_, j) => j !== setIdx) } : ex)
      }}));
    };
    const addEditSet = (exIdx) => {
      setEditingWorkout(prev => ({ ...prev, data: { ...prev.data,
        log: prev.data.log.map((ex, i) => {
          if (i !== exIdx) return ex;
          const last = ex.sets[ex.sets.length - 1] || { reps: 0, weight: 0 };
          return { ...ex, sets: [...ex.sets, { reps: last.reps, weight: last.weight }] };
        })
      }}));
    };
    const removeEditExercise = (exIdx) => {
      setEditingWorkout(prev => ({ ...prev, data: { ...prev.data, log: prev.data.log.filter((_, i) => i !== exIdx) }}));
    };
    const saveEditWorkout = () => {
      const cleaned = {
        ...editingWorkout.data,
        log: editingWorkout.data.log
          .map(ex => ({ ...ex, sets: ex.sets.map(s => ({ reps: Number(s.reps) || 0, weight: Number(s.weight) || 0 })) }))
          .filter(ex => ex.sets.length > 0)
          .map(ex => ({ ...ex, vol: ex.sets.reduce((a, b) => a + b.reps * b.weight, 0) }))
      };
      persist(KEYS.WORKOUTS, workouts.map((w, i) => i === editingWorkout.idx ? cleaned : w), setWorkouts);
      setEditingWorkout(null);
      vibrate(30);
    };

    /* --- Reset --- */
    const resetToDashboard = () => {
      setFlow('idle');
      setTab('dashboard');
      setActiveRoutine(null);
      setExerciseIndex(0);
      setCurrentSets([]);
      setSessionLog([]);
      setSessionStartedAt(0);
      setTimer(0);
      setTimerActive(false);
      setKbTime('');
      setKbRounds('');
      storage.remove(KEYS.SESSION);
    };

    /* --- Cálculos derivados --- */
    const sortedHealth = useMemo(
      () => [...health].sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0)),
      [health]
    );
    const lastHealth = sortedHealth.length > 0 ? sortedHealth[sortedHealth.length - 1] : null;
    const currentWeight = lastHealth ? lastHealth.weight : 0;
    const currentWaist  = lastHealth ? lastHealth.waist  : 0;

    const calc1RM = (w, r) => r === 1 ? w : Math.round(w * (36 / (37 - r)));
    const get1RM = (exId) => {
      let best = 0;
      workouts.forEach(w => (w.log || []).forEach(entry => {
        if (entry.id === exId) {
          (entry.sets || []).forEach(s => {
            if (s.weight > 0 && s.reps > 0 && s.reps <= 12) {
              const rm = calc1RM(s.weight, s.reps);
              if (rm > best) best = rm;
            }
          });
        }
      }));
      return best;
    };

    const lifts = useMemo(() => ({
      bench: get1RM('bench'),
      rdl:   get1RM('rdl'),
      sq:    get1RM('sq'),
      mil:   get1RM('mil')
    }), [workouts]);
    const targets = useMemo(() => {
      const bw = currentWeight || 95;
      return {
        bench: Math.round(bw),
        rdl:   Math.round(bw * 1.8),
        sq:    Math.round(bw * 1.5),
        mil:   Math.round(bw * 0.75)
      };
    }, [currentWeight]);

    const getDaysTrained = (days) => {
      const limit = Date.now() - days * 86400000;
      return workouts.filter(w => w.timestamp > limit).length;
    };

    /* --- Calendario semanal --- */
    const renderActivityLine = () => {
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const days = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date(today); d.setDate(d.getDate() - i);
        const isW = workouts.some(w => new Date(w.timestamp).toDateString() === d.toDateString());
        const isA = walks.some(w => new Date(w.timestamp).toDateString() === d.toDateString());
        days.push({
          n: d.toLocaleDateString('es-ES', { weekday: 'short' }).charAt(0).toUpperCase(),
          d: d.getDate(), isW, isA, isToday: i === 0
        });
      }
      return (
        <div className="flex justify-between items-center px-1">
          {days.map((day, i) => (
            <div key={i} className="flex flex-col items-center gap-2">
              <span className={`text-[10px] font-bold ${day.isToday ? 'text-emerald-500' : 'text-zinc-500'}`}>{day.isToday ? 'HOY' : day.n}</span>
              <div className={`h-8 rounded-full flex items-center justify-center border-2 transition-all ${
                day.isW && day.isA ? 'w-14 bg-emerald-500 border-emerald-400 gap-1.5 shadow-[0_0_10px_rgba(16,185,129,0.4)]' :
                day.isW ? 'w-8 bg-emerald-500 border-emerald-400 shadow-[0_0_10px_rgba(16,185,129,0.4)]' :
                day.isA ? 'w-8 bg-teal-500/10 border-teal-500 shadow-[0_0_10px_rgba(20,184,166,0.2)]' :
                'w-8 bg-zinc-950 border-zinc-900'
              }`}>
                {day.isW && <LayoutList size={12} className="text-zinc-950" />}
                {day.isA && <Activity size={12} className={day.isW && day.isA ? 'text-zinc-950' : 'text-teal-500'} />}
              </div>
              <span className={`text-[10px] font-bold ${day.isW || day.isA ? 'text-emerald-500' : 'text-zinc-700'}`}>{day.d}</span>
            </div>
          ))}
        </div>
      );
    };

    /* ========================================================
       FLUJO DE SESIÓN
       ======================================================== */
    const startSession = (key) => {
      setActiveRoutine(ROUTINES[key]);
      setExerciseIndex(0);
      setSessionLog([]);
      setKbTime('');
      setKbRounds('');
      setSessionStartedAt(Date.now());
      setFlow('prep');
    };

    /* Inicializa los inputs de un ejercicio.
       Si hay sesión previa de la misma rutina → pre-llena con esos valores. */
    const initExercise = (ex, isKb = false, lastValuesArg = null) => {
      const lastValues = lastValuesArg || (activeRoutine ? getLastSessionValues(activeRoutine.name) : null);
      const map = lastValues?.map || {};

      if (isKb) {
        setCurrentSets(KB_DEFAULTS.map(d => {
          const last = map[d.id]?.[0];
          return { name: d.name, id: d.id, r: last?.reps ?? d.reps, w: last?.weight ?? d.weight };
        }));
        return;
      }

      const series = ex.series || 1;
      const s = [];
      for (let i = 0; i < series; i++) {
        if (ex.isSS) {
          s.push({
            completed: false,
            subs: ex.subs.map(sub => {
              const last = map[sub.id]?.[i];
              return { r: last?.reps ?? sub.reps, w: last?.weight ?? sub.weight };
            })
          });
        } else {
          const last = map[ex.id]?.[i];
          s.push({
            r: last?.reps ?? ex.reps,
            w: last?.weight ?? ex.weight,
            completed: false
          });
        }
      }
      setCurrentSets(s);
    };

    const startTimer = (seconds) => {
      setEndsAt(Date.now() + seconds * 1000);
      setTimer(seconds);
      setTimerActive(true);
    };

    const completeSet = (idx) => {
      vibrate(30);
      setCurrentSets(prev => prev.map((s, i) => i === idx ? { ...s, completed: true } : s));
      const restTime = activeRoutine.exercises[exerciseIndex].rest || 60;
      startTimer(restTime);
    };

    const reopenSet = (idx) => {
      setCurrentSets(prev => prev.map((s, i) => i === idx ? { ...s, completed: false } : s));
    };

    const updateSimpleSet = (idx, field, value) => {
      setCurrentSets(prev => prev.map((s, i) => i === idx ? { ...s, [field]: value } : s));
    };

    const updateSubSet = (setIdx, subIdx, field, value) => {
      setCurrentSets(prev => prev.map((s, i) => i === setIdx
        ? { ...s, subs: s.subs.map((sb, j) => j === subIdx ? { ...sb, [field]: value } : sb) }
        : s));
    };

    const doNextStep = () => {
      const ex = activeRoutine.exercises[exerciseIndex];
      const newEntries = [];
      if (ex.isSS) {
        ex.subs.forEach((sub, sIdx) => {
          const sets = currentSets.filter(s => s.completed).map(lap => ({
            reps: Number(lap.subs[sIdx].r) || 0,
            weight: Number(lap.subs[sIdx].w) || 0
          }));
          if (sets.length > 0) {
            newEntries.push({
              id: sub.id, name: sub.name, sets,
              vol: sets.reduce((a, b) => a + b.reps * b.weight, 0)
            });
          }
        });
      } else {
        const sets = currentSets.filter(s => s.completed).map(s => ({
          reps: Number(s.r) || 0, weight: Number(s.w) || 0
        }));
        if (sets.length > 0) {
          newEntries.push({
            id: ex.id, name: ex.name, sets,
            vol: sets.reduce((a, b) => a + b.reps * b.weight, 0)
          });
        }
      }
      const log = [...sessionLog, ...newEntries];
      setSessionLog(log);

      if (exerciseIndex < activeRoutine.exercises.length - 1) {
        const nx = exerciseIndex + 1;
        setExerciseIndex(nx);
        initExercise(activeRoutine.exercises[nx]);
      } else {
        setFlow('summary');
      }
    };

    const nextStep = () => {
      const unsealed = currentSets.filter(s => !s.completed).length;
      if (unsealed > 0) {
        setConfirm({
          title: `${unsealed} serie${unsealed === 1 ? '' : 's'} sin sellar`,
          message: 'Solo se guardarán las series selladas. ¿Continuar de todos modos?',
          confirmLabel: 'Continuar',
          confirmColor: 'emerald',
          onConfirm: () => { setConfirm(null); doNextStep(); }
        });
        return;
      }
      doNextStep();
    };

    const handleFinishKB = () => {
      const rounds = Math.max(1, Number(kbRounds) || 1);
      const time = kbTime;
      const log = currentSets
        .filter(s => Number(s.r) > 0 || Number(s.w) > 0)
        .map(s => {
          const reps = Number(s.r) || 0;
          const weight = Number(s.w) || 0;
          const sets = Array(rounds).fill(null).map(() => ({ reps, weight }));
          return { id: s.id, name: s.name, sets, vol: reps * weight * rounds };
        });
      const customName = time ? `Kettlebell (${rounds} Rondas - ${time} min)` : `Kettlebell (${rounds} Rondas)`;
      setActiveRoutine({ ...activeRoutine, customName, name: customName });
      setSessionLog(log);
      setFlow('summary');
    };

    const askExitWorkout = () => setConfirm({
      title: 'Salir del entrenamiento',
      message: 'Se descartará la sesión activa. Las series ya guardadas en otras sesiones no se ven afectadas.',
      confirmLabel: 'Salir',
      confirmColor: 'red',
      onConfirm: () => { setConfirm(null); resetToDashboard(); }
    });

    const saveWorkout = () => {
      if (sessionLog.length === 0) {
        setConfirm({
          title: 'Sin series registradas',
          message: 'No hay series completadas en esta sesión. Vuelve atrás y sella al menos una serie.',
          confirmLabel: 'OK', confirmColor: 'zinc',
          onConfirm: () => setConfirm(null)
        });
        return;
      }
      setIsSaving(true);
      vibrate([40, 60, 40]);
      const name = activeRoutine.customName || activeRoutine.name;
      const entry = { id: uid(), timestamp: Date.now(), routine: name, log: sessionLog };
      const updated = [...workouts, entry];
      persist(KEYS.WORKOUTS, updated, setWorkouts);
      setTimeout(() => {
        setIsSaving(false);
        storage.remove(KEYS.SESSION);
        setFlow('finished');
      }, 300);
    };

    /* --- Reanudación de sesión --- */
    const resumeSession = () => {
      const s = resumePrompt;
      setActiveRoutine(s.activeRoutine);
      setExerciseIndex(s.exerciseIndex || 0);
      setCurrentSets(s.currentSets || []);
      setSessionLog(s.sessionLog || []);
      setSessionStartedAt(s.sessionStartedAt || Date.now());
      setKbTime(s.kbTime || '');
      setKbRounds(s.kbRounds || '');
      setFlow(s.flow);
      setResumePrompt(null);
    };
    const discardSession = () => {
      storage.remove(KEYS.SESSION);
      setResumePrompt(null);
    };

    /* --- Export CSV --- */
    const exportData = (mode) => {
      const today = new Date().toLocaleDateString('es-ES').replace(/\//g, '-');
      let csv = ''; let filename = '';
      if (mode === 'workout') {
        csv = 'Fecha,Hora,Rutina,Ejercicio,Serie,Reps,Peso\n';
        workouts.forEach(w => {
          const dt = new Date(w.timestamp);
          const d = dt.toLocaleDateString('es-ES');
          const h = dt.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
          (w.log || []).forEach(l => (l.sets || []).forEach((s, i) => {
            csv += [d, h, csvCell(w.routine), csvCell(l.name), i + 1, s.reps, s.weight].join(',') + '\n';
          }));
        });
        filename = `Entrenos_Alex_${today}.csv`;
      } else if (mode === 'health') {
        csv = 'Fecha,Peso (KG),Cintura (CM),Notas\n';
        sortedHealth.forEach(h => {
          csv += [h.date, h.weight, h.waist, csvCell(h.note || '-')].join(',') + '\n';
        });
        filename = `Salud_Alex_${today}.csv`;
      } else if (mode === 'walks') {
        csv = 'Fecha,Hora,Minutos\n';
        walks.forEach(w => {
          const dt = new Date(w.timestamp);
          csv += [dt.toLocaleDateString('es-ES'), dt.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }), w.minutes].join(',') + '\n';
        });
        filename = `Caminatas_Alex_${today}.csv`;
      }
      if (!downloadCsv(filename, csv)) {
        setConfirm({ title: 'Descarga bloqueada', message: 'Tu dispositivo no permite descargas directas.',
          confirmLabel: 'OK', confirmColor: 'zinc', onConfirm: () => setConfirm(null) });
      }
    };

    const exportAll = () => {
      const today = new Date().toLocaleDateString('es-ES').replace(/\//g, '-');
      let csv = '=== ENTRENOS ===\n';
      csv += 'Fecha,Hora,Rutina,Ejercicio,Serie,Reps,Peso,Volumen Ejercicio (KG)\n';
      workouts.forEach(w => {
        const dt = new Date(w.timestamp);
        const d = dt.toLocaleDateString('es-ES');
        const h = dt.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
        (w.log || []).forEach(l => (l.sets || []).forEach((s, i) => {
          csv += [d, h, csvCell(w.routine), csvCell(l.name), i + 1, s.reps, s.weight, l.vol || ''].join(',') + '\n';
        }));
      });
      csv += '\n=== NEAT (Caminatas) ===\n';
      csv += 'Fecha,Hora,Minutos\n';
      walks.forEach(w => {
        const dt = new Date(w.timestamp);
        csv += [dt.toLocaleDateString('es-ES'), dt.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }), w.minutes].join(',') + '\n';
      });
      csv += '\n=== SALUD (Pesajes) ===\n';
      csv += 'Fecha,Peso (KG),Cintura (CM),Notas\n';
      sortedHealth.forEach(h => {
        csv += [h.date, h.weight, h.waist, csvCell(h.note || '-')].join(',') + '\n';
      });
      if (!downloadCsv(`Entreno_Alex_TODO_${today}.csv`, csv)) {
        setConfirm({ title: 'Descarga bloqueada', message: 'Tu dispositivo no permite descargas directas.',
          confirmLabel: 'OK', confirmColor: 'zinc', onConfirm: () => setConfirm(null) });
      }
    };

    const summarizeWorkout = (w) => {
      const exCount = (w.log || []).length;
      const totalVol = (w.log || []).reduce((a, b) => a + (b.vol || 0), 0);
      const totalSets = (w.log || []).reduce((a, b) => a + (b.sets || []).length, 0);
      return { exCount, totalVol, totalSets };
    };

    /* --- Calendario --- */
    const sameDay = (a, b) => a.toDateString() === b.toDateString();
    const dayActivities = (date) => ({
      workouts: workouts.filter(x => sameDay(new Date(x.timestamp), date)),
      walks:    walks.filter(x => sameDay(new Date(x.timestamp), date)),
      health:   health.filter(x => x.timestamp && sameDay(new Date(x.timestamp), date))
    });
    const getMonthGrid = (firstOfMonth) => {
      const year = firstOfMonth.getFullYear();
      const month = firstOfMonth.getMonth();
      const firstDayOfWeek = (firstOfMonth.getDay() + 6) % 7; // L=0 ... D=6
      const grid = [];
      const lastOfPrev = new Date(year, month, 0).getDate();
      for (let i = firstDayOfWeek - 1; i >= 0; i--) {
        grid.push({ d: new Date(year, month - 1, lastOfPrev - i), inMonth: false });
      }
      const lastOfMonth = new Date(year, month + 1, 0).getDate();
      for (let i = 1; i <= lastOfMonth; i++) {
        grid.push({ d: new Date(year, month, i), inMonth: true });
      }
      while (grid.length % 7 !== 0) {
        const last = grid[grid.length - 1].d;
        const next = new Date(last.getTime()); next.setDate(next.getDate() + 1);
        grid.push({ d: next, inMonth: false });
      }
      return grid;
    };
    const monthLabel = (d) => d.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' })
      .replace(/^./, c => c.toUpperCase());
    const goPrevMonth = () => {
      setCalSelectedDay(null);
      setCalMonth(m => new Date(m.getFullYear(), m.getMonth() - 1, 1));
    };
    const goNextMonth = () => {
      setCalSelectedDay(null);
      setCalMonth(m => new Date(m.getFullYear(), m.getMonth() + 1, 1));
    };
    const goToday = () => {
      const d = new Date();
      setCalMonth(new Date(d.getFullYear(), d.getMonth(), 1));
      setCalSelectedDay(d);
    };

    const totalKgSession = sessionLog.reduce((a, b) => a + (b.vol || 0), 0);
    const lastSessionInfo = activeRoutine ? getLastSessionValues(activeRoutine.name) : null;

    /* ========================================================
       RENDER
       ======================================================== */
    return (
      <div className="min-h-screen bg-zinc-950 text-zinc-100 selection:bg-emerald-500/30 overflow-x-hidden pb-nav">

        {/* DASHBOARD */}
        {tab === 'dashboard' && flow === 'idle' && (
          <div className="p-5 space-y-6 anim-fade">
            <Button3D onClick={() => setFlow('selection')} className="w-full text-sm" color="emerald">
              <Play size={20} fill="currentColor" className="mr-1 mb-0.5" /> Iniciar Sesión de Hoy
            </Button3D>

            <section className="bg-zinc-900/60 border border-zinc-800 p-6 rounded-[2rem] shadow-xl">
              <h3 className="text-[10px] font-black uppercase text-zinc-500 tracking-widest mb-6 flex items-center gap-2">
                <Calendar size={14} className="text-emerald-500" /> Frecuencia
              </h3>
              <div className="grid grid-cols-3 gap-4">
                {[7, 15, 30].map(d => (
                  <div key={d} className="bg-zinc-950/50 p-4 rounded-2xl border border-zinc-800/50 text-center">
                    <p className="text-2xl font-black">{getDaysTrained(d)}</p>
                    <p className="text-[9px] font-bold text-zinc-500 uppercase mt-1">{d} Días</p>
                  </div>
                ))}
              </div>
            </section>

            <section className="bg-zinc-900/60 border border-zinc-800 p-6 rounded-[2rem] shadow-xl">
              <h3 className="text-[10px] font-black uppercase text-zinc-500 tracking-widest mb-6 flex items-center gap-2">
                <Activity size={14} className="text-emerald-500" /> Actividad Semanal
              </h3>
              {renderActivityLine()}
            </section>

            <section className="bg-zinc-900/60 border border-zinc-800 p-5 rounded-[2rem] shadow-xl">
              <h3 className="text-[10px] font-black uppercase text-zinc-500 tracking-widest mb-4 flex items-center gap-2">
                <Activity size={14} className="text-emerald-500" /> Evolución Física
              </h3>
              <PhysicalChart entries={sortedHealth} />
              {lastHealth && (
                <div className="flex items-center justify-center gap-3 mt-4 pt-4 border-t border-zinc-800/40">
                  <span className="text-[9px] font-bold text-zinc-600 uppercase tracking-widest">Último:</span>
                  <span className="text-base font-black text-blue-400">{currentWeight}<span className="text-[10px] text-zinc-600 ml-0.5">KG</span></span>
                  <span className="text-zinc-700">·</span>
                  <span className="text-base font-black text-emerald-400">{currentWaist}<span className="text-[10px] text-zinc-600 ml-0.5">CM</span></span>
                  {currentWaist > 0 && currentWaist < 94 && (
                    <span className="text-[9px] font-black text-amber-400 ml-1 px-1.5 py-0.5 rounded bg-amber-500/10 border border-amber-500/30 tracking-widest">SALUD ✓</span>
                  )}
                </div>
              )}
            </section>

            <section className="bg-zinc-900/60 border border-zinc-800 p-5 rounded-[2rem] shadow-xl">
              <h3 className="text-[10px] font-black uppercase text-zinc-500 tracking-widest mb-4 flex items-center gap-2">
                <Award size={14} className="text-emerald-500" /> Fuerza vs Meta
              </h3>
              <StrengthChart lifts={lifts} targets={targets} />
              {(() => {
                const reached = ['bench','rdl','sq','mil'].filter(i => (lifts[i] || 0) >= (targets[i] || 0)).length;
                return (
                  <p className="text-[9px] font-bold text-zinc-600 uppercase tracking-widest text-center mt-4 pt-4 border-t border-zinc-800/40">
                    <span className={reached > 0 ? 'text-emerald-400 font-black' : 'text-zinc-500'}>{reached}</span>
                    <span className="text-zinc-600"> / 4 EN META · BW {Math.round(currentWeight || 95)} KG</span>
                  </p>
                );
              })()}
            </section>

            <section className="pt-2">
              <Button3D onClick={exportAll} color="zinc" className="w-full">
                <Download size={18} className="text-emerald-500" />
                Exportar Todo (CSV)
              </Button3D>
              <p className="text-[9px] font-bold text-zinc-600 uppercase tracking-widest text-center mt-3">
                Entrenos · NEAT · Salud — Archivo único
              </p>
            </section>
          </div>
        )}

        {/* SELECCIÓN */}
        {flow === 'selection' && (
          <div className="p-5 space-y-4 anim-slide">
            <button onClick={() => setFlow('idle')} className="flex items-center gap-2 text-zinc-500 text-[10px] font-black uppercase tracking-widest mb-6 p-2 -ml-2">
              <ArrowLeft size={14} /> Volver al Panel
            </button>
            <h2 className="text-sm font-black uppercase tracking-widest border-b border-zinc-800 pb-4 mb-4">Seleccionar Rutina</h2>
            {Object.entries(ROUTINES).map(([k, r]) => {
              const last = getLastSessionValues(r.name);
              return (
                <Button3D key={k} onClick={() => startSession(k)} color="zinc" className="w-full text-left justify-between py-6">
                  <div className="flex flex-col items-start gap-1">
                    <span className="text-[9px] text-emerald-500 tracking-widest">
                      {last ? `Última: ${new Date(last.when).toLocaleDateString('es-ES', { day: '2-digit', month: 'short' })}` : 'Nueva rutina'}
                    </span>
                    <span className="text-base normal-case">{r.name}</span>
                  </div>
                  <ChevronRight size={24} className="text-zinc-600" />
                </Button3D>
              );
            })}
          </div>
        )}

        {/* PREP */}
        {flow === 'prep' && activeRoutine && (
          <div className="p-10 text-center space-y-10 anim-zoom mt-10">
            <div className="flex justify-center">
              <Anchor size={64} className="text-emerald-500 drop-shadow-[0_0_20px_rgba(16,185,129,0.3)]" />
            </div>
            <div>
              <h2 className="text-[10px] font-black uppercase text-zinc-500 mb-4 tracking-[0.3em]">Preparación</h2>
              <p className="text-2xl font-black uppercase leading-tight">{activeRoutine.prep}</p>
              {lastSessionInfo && (
                <p className="text-[10px] text-emerald-500/80 mt-6 tracking-widest font-bold">
                  📋 Pre-cargados los pesos del{' '}
                  {new Date(lastSessionInfo.when).toLocaleDateString('es-ES', { day: '2-digit', month: 'short' })}
                </p>
              )}
            </div>
            <Button3D onClick={() => {
              setFlow('workout');
              if (activeRoutine.type === 'kb') initExercise(null, true, lastSessionInfo);
              else initExercise(activeRoutine.exercises[0], false, lastSessionInfo);
            }} className="w-full text-sm">Todo Listo</Button3D>
          </div>
        )}

        {/* WORKOUT - STRENGTH */}
        {flow === 'workout' && activeRoutine && activeRoutine.type === 'strength' && (
          <div className="p-5 space-y-6 anim-fade">
            <div className="bg-zinc-900 border border-zinc-800 p-6 rounded-[2.5rem] shadow-2xl relative overflow-hidden">
              <div className="absolute top-0 left-0 w-full h-1.5 bg-emerald-500" />
              <button onClick={askExitWorkout} className="absolute top-4 right-4 text-zinc-600 hover:text-red-500 p-2.5 bg-zinc-950 rounded-xl border border-zinc-800 transition-colors">
                <X size={18} />
              </button>
              <p className="text-[10px] font-black text-emerald-500 uppercase tracking-widest bg-emerald-500/10 px-3 py-1 rounded-lg inline-block mb-4 border border-emerald-500/20">
                Bloque {exerciseIndex + 1} / {activeRoutine.exercises.length}
              </p>
              <h2 className="text-2xl font-black uppercase flex items-center gap-3 pr-12">
                {activeRoutine.exercises[exerciseIndex].isSS && <LayoutList className="text-zinc-600" size={24} />}
                {activeRoutine.exercises[exerciseIndex].name}
              </h2>
            </div>

            <div className="space-y-4">
              {currentSets.map((set, i) => (
                <div key={i} className={`p-6 rounded-[2rem] border transition-all duration-300 ${set.completed ? 'bg-zinc-950/80 opacity-70 border-emerald-900/30' : 'bg-zinc-900 border-zinc-800 shadow-xl'}`}>
                  <div className="flex justify-between items-center mb-6">
                    <span className="font-black text-zinc-400 uppercase text-[10px] tracking-widest">Serie {i + 1}</span>
                    {set.completed && (
                      <div className="flex items-center gap-2">
                        <button onClick={() => reopenSet(i)} className="text-zinc-500 hover:text-emerald-500 p-2.5 bg-zinc-950 rounded-xl transition-colors">
                          <Edit size={16} />
                        </button>
                        <CheckCircle size={24} className="text-emerald-500" />

              </div>
            )}
          </div>
        )}

        {/* MODAL: TIMER */}
        {timerActive && (
          <div className="fixed inset-0 bg-black/95 backdrop-blur-3xl z-[60] flex flex-col justify-center items-center p-8 anim-fade">
            <button onClick={() => setTimerActive(false)} className="absolute top-10 right-10 text-zinc-500 p-4 bg-zinc-900 rounded-full border border-zinc-800">
              <X size={28} />
            </button>
            <Timer size={80} className="text-emerald-500 mb-10 animate-pulse drop-shadow-[0_0_30px_rgba(16,185,129,0.5)]" />
            <h3 className="text-xs font-black text-emerald-500/80 uppercase mb-8 tracking-[0.4em]">Recuperación</h3>
            <div className="text-[8rem] sm:text-[11rem] font-black text-white tracking-tighter tabular-nums mb-16 leading-none drop-shadow-2xl">
              {Math.floor(timer / 60)}:{(timer % 60).toString().padStart(2, '0')}
            </div>
            <div className="flex w-full max-w-xs gap-5 mb-10">
              <Button3D onClick={() => setEndsAt(prev => Math.max(Date.now(), prev - 10000))} className="flex-1" color="zinc">-10s</Button3D>
              <Button3D onClick={() => setEndsAt(prev => prev + 10000)} className="flex-1" color="zinc">+10s</Button3D>
            </div>
            <Button3D onClick={() => { setTimer(0); setTimerActive(false); }} className="w-full max-w-xs text-sm" color="white">Saltar Descanso</Button3D>
          </div>
        )}

        {/* MODAL: NEAT */}
        {showWalkModal && (
          <div className="fixed inset-0 bg-black/90 backdrop-blur-2xl z-[60] flex justify-center items-center p-6 anim-fade">
            <div className="bg-zinc-900 border border-zinc-800 rounded-[3rem] w-full max-w-sm p-10 relative shadow-2xl">
              <button onClick={() => { setShowWalkModal(false); setWalkInput(''); }} className="absolute right-6 top-6 text-zinc-500 p-3 bg-zinc-950 rounded-full">
                <X size={20} />
              </button>
              <h3 className="text-[10px] font-black text-emerald-500 uppercase tracking-[0.3em] mb-8 flex items-center gap-2">
                <Footprints size={14} /> Caminata Extra
              </h3>
              <div className="relative mb-8">
                <input type="text" inputMode="numeric" pattern="[0-9]*" value={walkInput}
                       onChange={e => setWalkInput(e.target.value.replace(/\D/g, ''))}
                       className="w-full bg-zinc-950 border border-zinc-800 rounded-3xl p-8 text-6xl font-black text-center outline-none focus:border-emerald-500 transition-colors text-zinc-100"
                       placeholder="0" autoFocus />
                <div className="absolute -bottom-3 left-1/2 -translate-x-1/2 bg-zinc-950 px-4 py-1 rounded-full border border-zinc-800 text-[9px] font-bold text-zinc-500 uppercase tracking-widest">Minutos</div>
              </div>
              <Button3D onClick={() => {
                const m = parseInt(walkInput, 10);
                if (m > 0) {
                  persist(KEYS.WALKS, [...walks, { timestamp: Date.now(), minutes: m }], setWalks);
                  setShowWalkModal(false);
                  setWalkInput('');
                  vibrate(20);
                }
              }} className="w-full">Guardar NEAT</Button3D>
            </div>
          </div>
        )}

        {/* MODAL: AYUDA PWA */}
        {showHelpModal && (
          <div className="fixed inset-0 bg-black/95 backdrop-blur-2xl z-[70] flex flex-col p-8 anim-slide-lg overflow-y-auto">
            <button onClick={() => setShowHelpModal(false)} className="absolute top-8 right-8 text-zinc-500 p-2">
              <X size={32} />
            </button>
            <h2 className="text-2xl font-black uppercase tracking-widest text-zinc-100 mb-10 mt-12 flex items-center gap-3">
              <Smartphone className="text-emerald-500" /> Instalación App
            </h2>
            <div className="space-y-10">
              <div className="flex gap-5">
                <div className="w-10 h-10 rounded-full bg-emerald-500/20 text-emerald-500 flex items-center justify-center font-black flex-shrink-0 text-lg border border-emerald-500/30">1</div>
                <div>
                  <h3 className="font-black uppercase text-zinc-100 text-sm mb-2 tracking-widest">Subir a hosting</h3>
                  <p className="text-zinc-400 text-xs leading-relaxed">Sube <code className="text-emerald-400">index.html</code> + <code className="text-emerald-400">sw.js</code> a Netlify Drop o similar.</p>
                </div>
              </div>
              <div className="flex gap-5">
                <div className="w-10 h-10 rounded-full bg-emerald-500/20 text-emerald-500 flex items-center justify-center font-black flex-shrink-0 text-lg border border-emerald-500/30">2</div>
                <div>
                  <h3 className="font-black uppercase text-zinc-100 text-sm mb-2 tracking-widest">Navegador Nativo</h3>
                  <p className="text-zinc-400 text-xs leading-relaxed">Abre la URL en <b>Safari</b> (iOS) o <b>Chrome</b> (Android).</p>
                </div>
              </div>
              <div className="flex gap-5">
                <div className="w-10 h-10 rounded-full bg-emerald-500/20 text-emerald-500 flex items-center justify-center font-black flex-shrink-0 text-lg border border-emerald-500/30">3</div>
                <div>
                  <h3 className="font-black uppercase text-zinc-100 text-sm mb-2 tracking-widest">Añadir a Inicio</h3>
                  <p className="text-zinc-400 text-xs leading-relaxed">Compartir → <b>Añadir a pantalla de inicio</b>. Funciona offline tras la primera carga.</p>
                </div>
              </div>
            </div>
            <Button3D onClick={() => setShowHelpModal(false)} className="w-full mt-auto" color="white">Entendido</Button3D>
          </div>
        )}

        {/* MODAL: REANUDAR SESIÓN */}
        {resumePrompt && (
          <div className="fixed inset-0 bg-black/95 backdrop-blur-3xl z-[90] flex justify-center items-center p-6 anim-fade">
            <div className="bg-zinc-900 border border-emerald-500/30 rounded-[2.5rem] w-full max-w-sm p-8 shadow-2xl">
              <div className="flex items-center gap-3 mb-3">
                <Refresh size={20} className="text-emerald-500" />
                <h3 className="text-sm font-black uppercase tracking-widest">Sesión sin acabar</h3>
              </div>
              <p className="text-zinc-400 text-xs leading-relaxed mb-2">
                Tienes una sesión de <b className="text-zinc-100">{resumePrompt.activeRoutine?.customName || resumePrompt.activeRoutine?.name}</b> abierta
                {resumePrompt.sessionStartedAt && (
                  <> desde hace <b className="text-emerald-500">{Math.max(1, Math.round((Date.now() - resumePrompt.sessionStartedAt) / 60000))}</b> min</>
                )}.
              </p>
              <p className="text-zinc-500 text-[10px] tracking-widest uppercase mb-8">¿Reanudar o descartar?</p>
              <div className="grid grid-cols-2 gap-3">
                <Button3D onClick={discardSession} color="zinc">Descartar</Button3D>
                <Button3D onClick={resumeSession} color="emerald">Reanudar</Button3D>
              </div>
            </div>
          </div>
        )}

        {/* MODAL: EDITAR ENTRENAMIENTO */}
        {editingWorkout && (
          <div className="fixed inset-0 bg-zinc-950 z-[65] overflow-y-auto anim-fade">
            <div className="sticky top-0 bg-zinc-950/95 backdrop-blur-2xl border-b border-zinc-800 px-5 py-4 flex items-center justify-between z-10">
              <button onClick={cancelEditWorkout} className="flex items-center gap-2 text-zinc-500 text-[10px] font-black uppercase tracking-widest p-2 -ml-2">
                <ArrowLeft size={14} /> Cancelar
              </button>
              <span className="text-[10px] font-black uppercase tracking-widest text-emerald-500">Editando Sesión</span>
              <button onClick={saveEditWorkout} className="flex items-center gap-2 text-emerald-500 text-[10px] font-black uppercase tracking-widest p-2 -mr-2">
                <Save size={14} /> Guardar
              </button>
            </div>

            <div className="p-5 space-y-5 pb-32">
              <div className="bg-zinc-900 border border-zinc-800 p-5 rounded-[2rem]">
                <p className="text-[10px] font-black text-zinc-500 uppercase tracking-widest mb-1">Rutina</p>
                <p className="text-zinc-100 font-black uppercase text-sm">{editingWorkout.data.routine}</p>
                <p className="text-[10px] font-bold text-emerald-500 mt-1 tracking-widest">
                  {new Date(editingWorkout.data.timestamp).toLocaleString('es-ES', { dateStyle: 'short', timeStyle: 'short' })}
                </p>
              </div>

              {editingWorkout.data.log.length === 0 && (
                <p className="text-zinc-700 text-center py-12 text-xs uppercase font-black tracking-widest italic border-2 border-dashed border-zinc-900 rounded-[2rem]">
                  Sin ejercicios. Cancela para conservar.
                </p>
              )}

              {editingWorkout.data.log.map((ex, exIdx) => (
                <div key={exIdx} className="bg-zinc-900 border border-zinc-800 p-5 rounded-[2rem] shadow-xl">
                  <div className="flex justify-between items-center mb-4 pb-3 border-b border-zinc-800/60">
                    <p className="text-[11px] font-black text-zinc-200 uppercase tracking-widest flex-1 mr-2">{ex.name}</p>
                    <button onClick={() => removeEditExercise(exIdx)} className="text-zinc-500 hover:text-red-500 p-2.5 bg-zinc-950 rounded-xl">
                      <Trash2 size={16} />
                    </button>
                  </div>
                  <div className="space-y-3">
                    {ex.sets.map((s, sIdx) => (
                      <div key={sIdx} className="flex items-center gap-2">
                        <span className="text-[9px] font-black text-zinc-600 w-10 tracking-widest">S{sIdx + 1}</span>
                        <NumberInput integer value={s.reps}
                          onChange={v => updateEditSet(exIdx, sIdx, 'reps', v === '' ? 0 : v)}
                          suffix="Reps" />
                        <NumberInput value={s.weight}
                          onChange={v => updateEditSet(exIdx, sIdx, 'weight', v === '' ? 0 : v)}
                          suffix="KG" />
                        <button onClick={() => removeEditSet(exIdx, sIdx)} className="text-zinc-500 hover:text-red-500 p-2.5 bg-zinc-950 rounded-xl flex-shrink-0">
                          <X size={16} />
                        </button>
                      </div>
                    ))}
                  </div>
                  <button onClick={() => addEditSet(exIdx)} className="w-full mt-4 py-3 border-2 border-dashed border-zinc-800 hover:border-emerald-500/40 hover:text-emerald-500 text-zinc-600 rounded-xl text-[10px] font-black uppercase tracking-widest flex items-center justify-center gap-2 transition-colors">
                    <Plus size={14} /> Añadir Serie
                  </button>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* CONFIRM */}
        {confirm && (
          <Confirm open={true} title={confirm.title} message={confirm.message}
                   confirmLabel={confirm.confirmLabel} confirmColor={confirm.confirmColor}
                   onConfirm={confirm.onConfirm} onCancel={() => setConfirm(null)} />
        )}

        {/* NAV BOTTOM */}
        <div className="fixed bottom-0 left-0 right-0 bg-zinc-900/85 backdrop-blur-2xl border-t border-zinc-800 grid grid-cols-5 items-center z-40 px-1 shadow-[0_-2px_24px_rgba(0,0,0,0.5)] nav-fixed py-2">
          <button onClick={() => { setFlow('idle'); setTab('dashboard'); }}
                  className={`flex flex-col items-center gap-1.5 transition-all py-2 ${tab === 'dashboard' && flow === 'idle' ? 'text-emerald-500 drop-shadow-[0_0_8px_rgba(16,185,129,0.5)] scale-110' : 'text-zinc-600 hover:text-zinc-400'}`}>
            <Activity size={22} /><span className="text-[9px] font-black uppercase tracking-widest">Panel</span>
          </button>
          <button onClick={() => { setFlow('idle'); setTab('history'); }}
                  className={`flex flex-col items-center gap-1.5 transition-all py-2 ${tab === 'history' ? 'text-emerald-500 drop-shadow-[0_0_8px_rgba(16,185,129,0.5)] scale-110' : 'text-zinc-600 hover:text-zinc-400'}`}>
            <LayoutList size={22} /><span className="text-[9px] font-black uppercase tracking-widest">Datos</span>
          </button>
          <button onClick={() => { setFlow('idle'); setTab('calendar'); }}
                  className={`flex flex-col items-center gap-1.5 transition-all py-2 ${tab === 'calendar' ? 'text-emerald-500 drop-shadow-[0_0_8px_rgba(16,185,129,0.5)] scale-110' : 'text-zinc-600 hover:text-zinc-400'}`}>
            <Calendar size={22} /><span className="text-[9px] font-black uppercase tracking-widest">Mes</span>
          </button>
          <button onClick={() => { setFlow('idle'); setTab('metrics'); }}
                  className={`flex flex-col items-center gap-1.5 transition-all py-2 ${tab === 'metrics' ? 'text-emerald-500 drop-shadow-[0_0_8px_rgba(16,185,129,0.5)] scale-110' : 'text-zinc-600 hover:text-zinc-400'}`}>
            <Heart size={22} /><span className="text-[9px] font-black uppercase tracking-widest">Salud</span>
          </button>
          <button onClick={() => setShowWalkModal(true)}
                  className="flex flex-col items-center gap-1.5 transition-all py-2 text-zinc-600 hover:text-zinc-400">
            <Footprints size={22} /><span className="text-[9px] font-black uppercase tracking-widest">NEAT</span>
          </button>
        </div>
      </div>
    );
  };

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
